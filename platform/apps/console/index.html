<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Консоль агентов</title>

    <!-- Значки без названия продукта. Современные браузеры берут logo.svg,
         зелёный DDC с буквой «А». Значок apple-touch-icon непрозрачный и
         скруглённый, чтобы анимация установки в iOS не просвечивала обоями
         через углы. Mask-icon читает старый Safari для закреплённой вкладки.
         Развёртывание подменяет значки через CONSOLE_BRANDING_DIR. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="mask-icon" href="/logo.svg" color="#00805e" />

    <!-- Цвет браузерной панели: зелёный НБК в светлой теме, ink-950 в тёмной. -->
    <meta name="theme-color" content="#00805E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)" />

    <!-- Описание страницы. Консоль работает во внутреннем контуре за входом
         и не имеет публичного адреса, поэтому канонической ссылки и картинки
         превью с абсолютным адресом здесь нет. -->
    <meta name="description" content="Консоль конструктора агентов: агенты, сессии и инфраструктура." />

    <!-- Open Graph и карточка Twitter без картинки: превью текстом. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Консоль конструктора агентов" />
    <meta property="og:description" content="Агенты, сессии и инфраструктура." />
    <meta property="og:site_name" content="Консоль агентов" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Консоль конструктора агентов" />
    <meta name="twitter:description" content="Агенты, сессии и инфраструктура." />

    <!-- Cloudflare Turnstile грузится на странице входа и только тогда, когда
         сервер объявил ключ сайта (components/Turnstile.tsx). Предварительного
         соединения здесь нет: консоль работает во внутреннем контуре без
         внешних адресов (принцип 8 docs/ddc-design-system.md). -->
    <script>
      // Theme: system preference with manual override
      const t = localStorage.getItem("theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
